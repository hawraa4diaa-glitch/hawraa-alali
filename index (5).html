<style id="app-style">
/* Layout: RTL portfolio. Home = four subject cards; subject page = three work columns + a discussion band. */
:root{
  --bg:#f5f2ea; --surface:#faf7f0; --band:#e8e6da; --ink:#1f3a33; --muted:#6c776d; --line:#dcd7c8;
  --green:#2f5d4e; --on-green:#f5f2ea; --terra:#b4623f; --ochre:#a47b2e; --teal:#3b7a82; --field:#fffdf8; --danger:#a63d2f;
  --font:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b18; --surface:#1a231f; --band:#101613; --ink:#e9e6da; --muted:#98a396; --line:#2b3730;
  --green:#7fbfa7; --on-green:#10201a; --terra:#e0906d; --ochre:#d4ac5e; --teal:#7fbcc4; --field:#121a16; --danger:#e58b7c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b18; --surface:#1a231f; --band:#101613; --ink:#e9e6da; --muted:#98a396; --line:#2b3730;
  --green:#7fbfa7; --on-green:#10201a; --terra:#e0906d; --ochre:#d4ac5e; --teal:#7fbcc4; --field:#121a16; --danger:#e58b7c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band)}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.f{fill:currentColor;stroke:none}

/* header + footer */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top .wrap,.foot .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;cursor:pointer;padding:0;text-align:start}
.logo{width:36px;height:36px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center}
.brand b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.3}
.nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.nav .lnk{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px;padding:4px 0}
.nav .lnk:hover{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:13px;text-decoration:none;color:var(--green);background:var(--bg)}
.pill:hover{border-color:var(--green)}
.me{font-size:12px;color:var(--on-green);background:var(--green);border-radius:999px;padding:3px 12px}
.foot{border-top:1px solid var(--line);background:var(--surface);margin-top:0}
.foot p{margin:0;color:var(--muted);font-size:12.5px}

/* home */
.hero{padding-block:clamp(48px,9vw,110px) 28px}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;margin-bottom:20px}
.eyebrow::after{content:"";width:44px;border-top:1px solid var(--muted);opacity:.6}
h1{margin:0;font-weight:700;font-size:clamp(38px,7vw,76px);line-height:1.2;text-wrap:balance}
h1 em{display:block;font-weight:500;font-style:italic;color:var(--green)}
.sub{color:var(--muted);max-width:48ch;margin:22px 0 0;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding-block:20px clamp(48px,8vw,100px)}
.card{background:var(--surface);border:1px solid var(--line);padding:20px;min-height:220px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;text-align:start;cursor:pointer;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.card .row{display:flex;justify-content:space-between;align-items:flex-start;color:var(--c)}
.card .row span{font-size:12px;color:var(--muted)}
.card svg.i{width:26px;height:26px}
.card h2{margin:0;font-size:24px;font-weight:600;line-height:1.3}
.card p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.card .go{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

/* subject */
.back{background:none;border:0;cursor:pointer;color:var(--muted);display:inline-flex;gap:8px;align-items:center;font-size:13px;margin-top:44px;padding:4px 0}
.back:hover{color:var(--ink)}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-block:22px 22px;border-bottom:1px solid var(--line)}
.stitle{display:flex;align-items:center;gap:16px}
.sicon{width:50px;height:50px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--c);background:var(--surface)}
.sicon svg.i{width:24px;height:24px}
.stitle small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.stitle h2{margin:0;font-size:clamp(30px,5vw,40px);font-weight:500;line-height:1.3}
.search{border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;min-width:min(260px,100%);font-style:italic}
.search::placeholder{color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-block:24px 56px}
.col{background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;min-height:330px;min-width:0}
.col header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.col h3{margin:0;font-size:16px;font-weight:600;display:flex;align-items:baseline;gap:8px}
.col h3 span{font-size:11px;color:var(--c);font-weight:400}
.count{min-width:24px;height:24px;border-radius:12px;background:var(--band);color:var(--muted);font-size:11px;display:grid;place-items:center;padding-inline:6px}
.list{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 20px;min-width:0}
.empty{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.item{border-bottom:1px dashed var(--line);padding-bottom:12px;min-width:0}
.item:last-child{border-bottom:0;padding-bottom:0}
.item h4{margin:0;font-size:15px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.item time{display:block;font-size:11.5px;color:var(--muted)}
.item p{margin:4px 0 0;font-size:13.5px;color:var(--ink);opacity:.85;white-space:pre-wrap;overflow-wrap:anywhere}
.item .open{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--c);text-decoration:none}
.item .open:hover{text-decoration:underline}
.att{display:block;margin-top:8px}.att img{display:block;width:100%;max-height:220px;object-fit:cover;border:1px solid var(--line)}
.file{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:6px 12px;border:1px solid var(--line);font-size:12.5px;text-decoration:none;color:var(--c);max-width:100%}.file span{overflow-wrap:anywhere}
.hint{font-size:11.5px;color:var(--muted)}
.tools{display:flex;gap:14px;margin-top:6px}
.tools button{background:none;border:0;padding:0;cursor:pointer;font-size:12px;color:var(--muted)}
.tools button:hover{color:var(--ink)}
.tools .danger:hover,.tools .danger.ask{color:var(--danger)}
.add{border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 20px;font-size:13px;width:100%;color:var(--ink)}
.add:hover{background:var(--band)}
.add span{display:flex;align-items:center;gap:8px}

/* discussion */
.talk{padding-block:56px 72px}
.talkgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,5vw,72px);align-items:start}
.talkgrid h2{margin:0;font-size:clamp(28px,4.5vw,40px);font-weight:500;line-height:1.35;display:flex;align-items:center;gap:12px}
.talkgrid h2 svg{width:30px;height:30px;color:var(--c)}
.talkgrid .intro{color:var(--muted);font-size:13.5px;margin:14px 0 0;max-width:42ch}
.box{border:1px dashed var(--muted);padding:20px;display:flex;flex-direction:column;gap:16px;min-height:200px;min-width:0}
.box .none{margin:auto;text-align:center;color:var(--muted);font-size:13px}
.box .none small{display:block;font-size:11px;margin-top:6px;opacity:.8}
.post{background:var(--surface);border:1px solid var(--line);padding:14px 16px;min-width:0}
.post p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.post time{font-size:11.5px;color:var(--muted)}
.post .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.post .tools{margin:0}
.compose{display:flex;flex-direction:column;gap:10px}
textarea,.fld{width:100%;background:var(--field);border:1px solid var(--line);padding:10px 12px;border-radius:2px}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--green);color:var(--on-green);border:0;padding:9px 22px;cursor:pointer;border-radius:2px;font-weight:500;align-self:flex-start}
.btn:hover{opacity:.9}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(15,25,20,.55);display:grid;place-items:center;padding:16px;z-index:20}
.md{background:var(--surface);border:1px solid var(--line);width:min(480px,100%);max-height:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.md h3{margin:0;font-size:20px;font-weight:600}
.md label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.md .acts{display:flex;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13px;z-index:30}

@media (max-width:980px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.talkgrid{grid-template-columns:1fr}}
@media (max-width:520px){.cards{grid-template-columns:1fr}.card{min-height:170px}}
</style>

 {id:'bio',name:'الأحياء',tag:'أصغي إلى تفاصيل الحياة…',c:'--ochre',icon:'<path d="M5 19C4 11 9 5 20 4c1 11-5 16-13 15z"/><path d="M5 19c3-5 6-8 10-10"/>'}
];

];

var view=null,query='',canEdit=false,artifact=null,assetsApi=null,ask=null;

function fdate(d){if(!d)return '';var x=new Date(d+'T00:00:00');if(isNaN(x))return '';return x.toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}

function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{var p=new URL(u);return /^https?:$/.test(p.protocol)?p.href:''}catch(e){return ''}}

 if(!f||!f.url||!/^(\/|https:\/\/)/.test(f.url))return '';var u=esc(f.url);
 if(/^image\//.test(f.type||''))return '<a class="att" href="'+u+'" target="_blank" rel="noopener"><img src="'+u+'" alt="'+esc(f.name)+'" loading="lazy"></a>';

 return '<div class="top"><div class="wrap"><button class="brand" data-act="home" type="button"><span class="logo">'+ico(I.spark)+'</span><span><b>ملف إنجازي</b><small>فصول موهبة</small></span></button>'+
 '<nav class="nav" aria-label="التنقل">'+(canEdit?'<span class="me">وضع التحرير</span>':'')+'<button class="lnk" data-act="home" type="button">جميع المواد '+ico(I.arrow)+'</button><a class="pill" href="'+LINKEDIN+'" target="_blank" rel="noopener">LinkedIn '+LI+'</a></nav></div></div>'

 }).join('');

  return '<div class="post"><p>'+esc(p.text)+'</p><div class="meta"><time>'+fdate(p.date)+'</time>'+(canEdit?'<div class="tools"><button type="button" class="danger'+(ask===k?' ask':'')+'" data-act="del" data-key="talk" data-id="'+p.id+'">'+(ask===k?'اضغطي للتأكيد':'حذف')+'</button></div>':'')+'</div></div>'
 }).join(''):'<div class="none">أول فكرة في هذا الصندوق<br>ستكون بداية الحوار.<small>لا توجد مشاركات بعد</small></div>';
 var comp=canEdit?'<form class="compose" id="talkform"><label class="sr" for="talktext" style="position:absolute;left:-9999px">مشاركة جديدة</label><textarea id="talktext" placeholder="اكتبي سؤالاً أو فكرة أو ملاحظة…" required></textarea><button class="btn" type="submit">أضيفي إلى الحوار</button></form>':'';
 return '<section class="talk band" style="--c:var('+s.c+')"><div class="wrap talkgrid"><div><div class="eyebrow">حوار المادة</div><h2>'+ico(I.chat)+'صندوق نقاش '+s.name+'</h2><p class="intro">مساحة مستقلة لهذه المادة: سؤال عالق، أو فكرة جديدة، أو ملاحظة تستحق المشاركة.</p></div><div class="box">'+body+comp+'</div></div></section>'
}
function subject(s){
 return header()+'<main><div class="wrap"><button class="back" data-act="home" type="button">العودة إلى المواد '+ico(I.arrow)+'</button><div class="shead" style="--c:var('+s.c+')"><div class="stitle"><span class="sicon">'+ico(s.icon)+'</span><div><small>دفتر المادة</small><h2>'+s.name+'</h2></div></div><label class="sr" for="q" style="position:absolute;left:-9999px">بحث</label><input class="search" id="q" type="search" placeholder="'+esc(s.tag)+'" value="'+esc(query)+'" autocomplete="off"></div><div class="cols" id="cols" style="--c:var('+s.c+')">'+colsHtml(s)+'</div></div>'+talkHtml(s)+'</main>'+footer()
}
function render(){
 var s=view&&sub(view);
 $('screen').innerHTML=s?subject(s):home();
 document.title='ملف إنجازي';
}
function go(id){
 view=id||null;query='';ask=null;
 try{if(view)sessionStorage.setItem('view',view);else sessionStorage.removeItem('view')}catch(e){}
 try{location.hash=view||''}catch(e){}
 render();window.scrollTo(0,0);
}
function toast(msg,keep){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);if(!keep)toast.t=setTimeout(function(){t.hidden=true},2800)}

/* saving: the page republishes itself from its state */
var HEAD='<meta name="claude:viewport-fit-sides" content="cover">\n<title>ملف إنجازي</title>\n<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">\n';
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){
 var data=JSON.stringify(state).replace(/</g,'\\u003c');
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+HEAD+
 '<style id="app-style">'+$('app-style').textContent+'</style>\n<div id="app" lang="ar" dir="rtl"><div id="screen"></div><div id="modal" hidden></div><div id="toast" class="toast" hidden></div></div>\n'+
 '<script type="application/json" id="app-data">'+data+'<\/script>\n<script id="app-script">'+$('app-script').textContent+'<\/script></body></html>'
}
var saving=false;
function save(mutate){
 if(!canEdit||!artifact||saving)return;
 var before=JSON.stringify(state);
 mutate();saving=true;render();toast('جارٍ الحفظ…',true);
 try{sessionStorage.setItem('view',view||'')}catch(e){}
 artifact.publish(buildDoc()).then(function(){toast('تم الحفظ',true)}).catch(function(e){
  saving=false;
  if(e&&e.code==='conflict')return;
  state=JSON.parse(before);render();
  toast('لم يُحفظ التغيير. حاولي مرة أخرى.');
 });
}

/* modal */
function openForm(key,id){
 var s=sub(view),c=COLS.filter(function(x){return x.key===key})[0],it=id?list(view,key).filter(function(x){return x.id===id})[0]:null;
 var m=$('modal');
 m.className='ov';m.hidden=false;
 m.innerHTML='<form class="md" id="form" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">'+(it?'تعديل':'إضافة')+' · '+c.title+' '+s.name+'</h3>'+
 '<label for="f-title">العنوان<input class="fld" id="f-title" required maxlength="120" value="'+esc(it?it.title:'')+'"></label>'+
 '<label for="f-date">التاريخ<input class="fld" id="f-date" type="date" value="'+esc(it?it.date:today())+'"></label>'+
 '<label for="f-note">وصف أو ملاحظات<textarea id="f-note" maxlength="1500">'+esc(it?it.note:'')+'</textarea></label>'+
 '<label for="f-link">رابط الملف أو العمل (اختياري)<input class="fld" id="f-link" type="text" dir="ltr" placeholder="https://" value="'+esc(it?it.link:'')+'"></label>'+
 (assetsApi?'<label for="f-file">صورة أو ملف (اختياري)<input class="fld" id="f-file" type="file" accept="image/*,.pdf,.txt,.csv,.md,.json,video/*"><span class="hint">صور وPDF وفيديو ونصوص، حتى ٢٠ ميغابايت. حوّلي ملفات Word وPowerPoint إلى PDF.</span></label>'+(it&&it.file?'<label for="f-rm" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="f-rm"> إزالة المرفق الحالي ('+esc(it.file.name)+')</label>':''):'')+
 '<div class="acts"><button class="btn" type="submit">حفظ</button><button class="btn ghost" type="button" data-act="close">إلغاء</button></div></form>';
 $('form').dataset.key=key;$('form').dataset.id=id||'';
 $('f-title').focus();
}
function closeForm(){var m=$('modal');m.hidden=true;m.innerHTML=''}

document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');
 if(!b){if(e.target.id==='modal')closeForm();return}
 var a=b.dataset.act,key=b.dataset.key,id=b.dataset.id;
 if(a==='home')go(null);
 else if(a==='open')go(id);
 else if(a==='close')closeForm();
 else if(a==='add'&&canEdit)openForm(key);
 else if(a==='edit'&&canEdit)openForm(key,id);
 else if(a==='del'&&canEdit){
  var k=key+':'+id;
  if(ask!==k){ask=k;render();return}
  ask=null;
  save(function(){put(view,key,list(view,key).filter(function(x){return x.id!==id}))});
 }
});
document.addEventListener('input',function(e){
 if(e.target.id==='q'){query=e.target.value;var s=sub(view);$('cols').innerHTML=colsHtml(s)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeForm()});
document.addEventListener('submit',function(e){
 e.preventDefault();
 if(!canEdit)return;
 if(e.target.id==='form'){
  var f=e.target,key=f.dataset.key,id=f.dataset.id;
  var rec={id:id||uid(),title:$('f-title').value.trim(),date:$('f-date').value,note:$('f-note').value.trim(),link:$('f-link').value.trim(),file:keepFile(id)};
  if(!rec.title)return;
  var fin=function(){
   closeForm();
   save(function(){
    var arr=list(view,key).slice();
    if(id){arr=arr.map(function(x){return x.id===id?rec:x})}else{arr.unshift(rec)}
    put(view,key,arr);
   });
  };
  var fi=$('f-file')&&$('f-file').files[0];
  if(!fi){fin();return}
  if(fi.size>20*1024*1024){toast('حجم الملف أكبر من ٢٠ ميغابايت.');return}
  var sb=f.querySelector('button[type=submit]');sb.disabled=true;toast('جارٍ رفع الملف…',true);
  assetsApi.upload(fi).then(function(r){rec.file={url:r.url,name:fi.name,type:r.contentType||fi.type};fin()}).catch(function(err){sb.disabled=false;toast(err&&err.code==='unsupported_type'?'نوع الملف غير مدعوم. حوّليه إلى PDF.':'تعذّر رفع الملف. حاولي مرة أخرى.')});
 }else if(e.target.id==='talkform'){
  var t=$('talktext').value.trim();if(!t)return;
  save(function(){put(view,'talk',[{id:uid(),text:t,date:today()}].concat(list(view,'talk')))});
 }
});

/* start: everyone sees the page; only the owner gets editing */
var h=(location.hash||'').slice(1),st=null;
try{st=sessionStorage.getItem('view')}catch(e){}
view=sub(h)?h:(sub(st)?st:null);
render();
if(window.claude&&window.claude.use){
 Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('assets')]).then(function(r){
  var u=r[0];artifact=r[1];assetsApi=r[2];
  canEdit=!!(u&&u.isOwner&&u.isOwner()&&artifact);
  if(canEdit)render();
 }).catch(function(){});
}
})();
</script>

</body></html>
